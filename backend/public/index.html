<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>odontoai – agenda odontológica</title>
<style>
:root{--bg:#F2F7F8;--surface:#fff;--ink:#12303A;--muted:#5B7580;--brand:#0E6E7E;--brand-ink:#fff;--soft:#D8EEF1;--line:#D3E1E5;--ok:#1B7F4B;--bad:#B3392F;--warn:#9A6A00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1B20;--surface:#15282F;--ink:#E4F0F3;--muted:#92AAB3;--brand:#4FC1D1;--brand-ink:#062329;--soft:#1D3A43;--line:#274650;--ok:#58C98C;--bad:#F08A80;--warn:#E8B84A}}
:root[data-theme="dark"]{--bg:#0D1B20;--surface:#15282F;--ink:#E4F0F3;--muted:#92AAB3;--brand:#4FC1D1;--brand-ink:#062329;--soft:#1D3A43;--line:#274650;--ok:#58C98C;--bad:#F08A80;--warn:#E8B84A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo span{color:var(--brand)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--ink);font:600 14px Figtree,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;line-height:1.15;margin:4px 0 4px;font-weight:800;letter-spacing:-.5px}
h2{font-size:18px;margin:28px 0 10px;font-weight:800}
p.sub{color:var(--muted);margin:0 0 18px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:600 15px Figtree,sans-serif;cursor:pointer}
.opt small{display:block;font-weight:400;color:var(--muted)}
.opt[aria-pressed=true]{border-color:var(--brand);background:var(--soft)}
.opt:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.days,.slots{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.days .opt{flex:0 0 auto;width:auto;flex-direction:column;align-items:center;gap:0;padding:10px 14px}
.slots{flex-wrap:wrap;overflow:visible}.slots .opt{width:auto;padding:9px 14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input{width:100%;font:400 16px Figtree,sans-serif;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.main{width:100%;margin-top:18px;border:0;background:var(--brand);color:var(--brand-ink);font:800 17px Figtree,sans-serif;padding:15px;border-radius:12px;cursor:pointer}
button.ghost{border:1.5px solid var(--line);background:none;color:var(--ink);font:600 14px Figtree,sans-serif;padding:7px 12px;border-radius:9px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.pix{background:var(--soft);border-radius:10px;padding:12px;word-break:break-all;font-size:13px;margin-top:10px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--soft)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.5px}.stat span{color:var(--muted);font-size:14px}
.appt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.appt:first-child{border-top:0}
.total{font-size:36px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:608px;margin:auto;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:12px;font-weight:600;z-index:20}
.empty{color:var(--muted);padding:8px 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .25s}@keyframes in{from{transform:translateY(12px);opacity:0}}}
</style>
</head>
<body>
<header>
  <div class="logo">odont<span>ai</span></div>
  <div class="seg" role="group" aria-label="Acesso">
    <button id="bP" aria-pressed="true">Paciente</button>
    <button id="bD" aria-pressed="false">Dentista</button>
  </div>
</header>
<main id="app"></main>
<footer style="text-align:center;padding:0 16px 32px;font-size:14px"><a href="/privacidade" style="color:var(--muted)">Política de privacidade</a></footer>
<div id="toast" class="toast" hidden></div>
<script>
var PROC=[{n:"Consulta e avaliação",p:120,d:"30 min"},{n:"Limpeza e profilaxia",p:180,d:"45 min"},{n:"Clareamento",p:450,d:"1 h"},{n:"Restauração",p:260,d:"1 h"},{n:"Tratamento de canal",p:700,d:"1 h 30"}];
var HOURS=["08:00","09:00","10:00","11:00","14:00","15:00","16:00","17:00"];
var MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var DIAS=["dom","seg","ter","qua","qui","sex","sáb"];
var role="p",db=[],tok="",mineK=load(),st={proc:0,day:null,time:null,mes:ym(new Date())};
function load(){try{return JSON.parse(localStorage.getItem("odontoai")||"[]")}catch(e){return[]}}
function save(){try{localStorage.setItem("odontoai",JSON.stringify(mineK))}catch(e){}}
function api(m,u,b){var h={"Content-Type":"application/json"};if(role==="d"&&tok)h.Authorization="Bearer "+tok;
return fetch(u,{method:m,headers:h,body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){if(r.status===401&&role==="d")tok="";if(!r.ok)throw new Error(j.error||"Erro de conexão");return j})})}
function refresh(){return api("GET","/api/appts?mine="+encodeURIComponent(mineK.map(function(k){return k.id+":"+k.key}).join(","))).then(function(l){db=l;render()}).catch(function(e){render();toast(e.message)})}
function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function iso(d){return ym(d)+"-"+String(d.getDate()).padStart(2,"0")}
function brl(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function fdate(s){var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function days(){var a=[],d=new Date();for(var i=0;a.length<14;i++){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+i);if(x.getDay()!==0)a.push(x)}return a}
function taken(day,t){return db.some(function(a){return a.day===day&&a.time===t&&a.status!=="cancelada"})}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},3200)}
function setRole(r){role=r;db=[];document.getElementById("bP").setAttribute("aria-pressed",r==="p");document.getElementById("bD").setAttribute("aria-pressed",r==="d");render();if(r==="p"||tok)refresh()}
document.getElementById("bP").onclick=function(){setRole("p")};
document.getElementById("bD").onclick=function(){setRole("d")};

function render(){document.getElementById("app").innerHTML=role==="p"?patient():dentist();bind()}

function patient(){
  var h='<h1>Agende sua consulta</h1><p class="sub">Escolha o serviço e o horário. O pagamento é feito direto na clínica.</p>';if(st.msg)h+='<div class="pix" style="margin:0 0 12px">'+st.msg+'</div>';
  h+='<h2>Serviço</h2><div class="opts">'+PROC.map(function(p,i){return '<button class="opt" data-proc="'+i+'" aria-pressed="'+(st.proc===i)+'"><span>'+p.n+'<small>'+p.d+'</small></span><span>'+brl(p.p)+'</span></button>'}).join("")+'</div>';
  h+='<h2>Dia</h2><div class="days">'+days().map(function(d){var k=iso(d);return '<button class="opt" data-day="'+k+'" aria-pressed="'+(st.day===k)+'"><small>'+DIAS[d.getDay()]+'</small><span>'+d.getDate()+'/'+(d.getMonth()+1)+'</span></button>'}).join("")+'</div>';
  if(st.day){h+='<h2>Horário</h2><div class="slots">'+HOURS.map(function(t){return '<button class="opt" data-time="'+t+'" aria-pressed="'+(st.time===t)+'"'+(taken(st.day,t)?' disabled':'')+'>'+t+'</button>'}).join("")+'</div>'}
  h+='<h2>Seus dados</h2><div class="box"><label for="nm">Nome completo</label><input id="nm" autocomplete="name"><label for="tel">WhatsApp</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(18) 99999-9999"></div>';
  h+='<button class="main" id="go">Confirmar agendamento · '+brl(PROC[st.proc].p)+'</button>';
  var mine=db.filter(function(a){return a.mine});
  h+='<h2>Minhas consultas</h2><div class="box">'+(mine.length?mine.slice().reverse().map(function(a){return apptRow(a,false)}).join(""):'<div class="empty">Você ainda não tem consultas. Escolha um horário acima.</div>')+'</div>';
  return h}

function apptRow(a,adm){
  var cls=a.status==="cancelada"?"bad":a.status==="concluída"?"ok":"warn";
  var btn="";
  if(!adm){btn='<button class="ghost" data-delete="'+a.id+'">Excluir meus dados</button> '}if(a.status==="agendada"){btn=adm?'<button class="ghost" data-done="'+a.id+'">Concluir</button> ':'';btn+='<button class="ghost" data-cancel="'+a.id+'">Cancelar</button>'}
  return '<div class="appt"><div><b>'+esc(a.name)+'</b><br>'+esc(a.proc)+(adm&&a.phone?'<br>WhatsApp: '+esc(a.phone):'')+'<br><span style="color:var(--muted)">'+fdate(a.day)+' às '+a.time+' · '+brl(a.price)+'</span></div><div style="text-align:right"><span class="tag '+cls+'">'+a.status+'</span><div style="margin-top:8px">'+btn+'</div></div></div>'}

function dentist(){
  if(!tok)return '<h1>Área do dentista</h1><p class="sub">Entre com a senha da clínica.</p><div class="box"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password"><button class="main" id="login">Entrar</button></div>';
  var m=st.mes,list=db.filter(function(a){return a.day.indexOf(m)===0}).sort(function(a,b){return(a.day+a.time)<(b.day+b.time)?-1:1});
  var ok=list.filter(function(a){return a.status!=="cancelada"});
  var total=ok.reduce(function(s,a){return s+a.price},0),done=list.filter(function(a){return a.status==="concluída"}).length;
  var canc=list.filter(function(a){return a.status==="cancelada"}).length,pend=list.filter(function(a){return a.status==="agendada"}).length;
  var p=m.split("-"),prev=new Date(+p[0],+p[1]-2,1),next=new Date(+p[0],+p[1],1);
  var h='<h1>Painel do dentista</h1><p class="sub">Agenda e valores previstos do mês.</p>';
  h+='<div class="box" style="display:flex;align-items:center;justify-content:space-between"><button class="ghost" data-mes="'+ym(prev)+'" aria-label="Mês anterior">Anterior</button><b>'+MESES[+p[1]-1]+' de '+p[0]+'</b><button class="ghost" data-mes="'+ym(next)+'" aria-label="Próximo mês">Próximo</button></div>';
  h+='<div class="box stat"><span>Valor previsto do mês (consultas não canceladas)</span><b class="total">'+brl(total)+'</b></div>';
  h+='<div class="stats"><div class="box stat"><b>'+ok.length+'</b><span>consultas agendadas</span></div><div class="box stat"><b>'+done+'</b><span>concluídas</span></div><div class="box stat"><b>'+pend+'</b><span>a atender</span></div><div class="box stat"><b>'+canc+'</b><span>canceladas</span></div></div>';
  h+='<h2>Agenda do mês</h2><div class="box">'+(list.length?list.map(function(a){return apptRow(a,true)}).join(""):'<div class="empty">Nenhuma consulta neste mês. Quando um paciente agendar, ela aparece aqui.</div>')+'</div>';
  return h}

function bind(){
  var q=function(s){return document.querySelectorAll(s)};
  q("[data-proc]").forEach(function(b){b.onclick=function(){st.proc=+b.dataset.proc;keep()}});
  q("[data-day]").forEach(function(b){b.onclick=function(){st.day=b.dataset.day;st.time=null;keep()}});
  q("[data-time]").forEach(function(b){b.onclick=function(){st.time=b.dataset.time;keep()}});
  q("[data-mes]").forEach(function(b){b.onclick=function(){st.mes=b.dataset.mes;render()}});
  q("[data-delete]").forEach(function(b){b.onclick=function(){deleteData(b.dataset.delete)}});
  q("[data-cancel]").forEach(function(b){b.onclick=function(){setStatus(b.dataset.cancel,"cancelada");}});
  q("[data-done]").forEach(function(b){b.onclick=function(){setStatus(b.dataset.done,"concluída");}});
  var go=document.getElementById("go");if(go)go.onclick=confirmar;
  var lg=document.getElementById("login");if(lg)lg.onclick=function(){api("POST","/api/login",{password:val("pw")}).then(function(r){tok=r.token;refresh()}).catch(function(e){toast(e.message)})}}
function keep(){var n=val("nm"),t=val("tel"),y=window.scrollY;render();set("nm",n);set("tel",t);window.scrollTo(0,y)}
function val(i){var e=document.getElementById(i);return e?e.value:""}
function set(i,v){var e=document.getElementById(i);if(e)e.value=v}
function setStatus(id,s){var k=mineK.filter(function(x){return x.id===id})[0];api("PATCH","/api/appts/"+id,{status:s,key:role==="p"&&k?k.key:undefined}).then(refresh).catch(function(e){toast(e.message);refresh()})}

function deleteData(id){
  var k=mineK.filter(function(x){return x.id===id})[0];
  if(!k)return toast("Chave do agendamento não encontrada neste dispositivo.");
  if(!confirm("Excluir permanentemente este agendamento e seus dados pessoais? Essa ação não pode ser desfeita."))return;
  api("DELETE","/api/appts/"+id,{key:k.key}).then(function(){mineK=mineK.filter(function(x){return x.id!==id});save();toast("Dados excluídos com sucesso.");return refresh()}).catch(function(e){toast(e.message)})
}
function confirmar(){
  var n=val("nm").trim(),t=val("tel").replace(/\D/g,"");
  if(!st.day||!st.time)return toast("Escolha o dia e o horário da consulta.");
  if(n.length<3)return toast("Informe o seu nome completo.");
  if(t.length<10)return toast("Informe um WhatsApp com DDD.");
  api("POST","/api/appts",{proc:st.proc,day:st.day,time:st.time,name:n,phone:t}).then(function(r){
    mineK.push({id:r.id,key:r.key});save();st.day=null;st.time=null;st.msg="<b>Consulta agendada.</b> Pague na clínica no dia do atendimento.";
    refresh().then(function(){window.scrollTo(0,0)});toast("Consulta agendada com sucesso.")
  }).catch(function(e){toast(e.message);refresh()})}
refresh();
</script>
</body>
</html>
